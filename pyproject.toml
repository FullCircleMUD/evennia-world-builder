[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-world-builder"
version = "0.0.1"
description = "Declarative YAML-driven world authoring for Evennia"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
dependencies = [
    "evennia",
    "pyyaml",
    "evennia-yaml-reader",
]

[project.scripts]
wb-validate = "evennia_world_builder.cli:_validate_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_world_builder*"]
